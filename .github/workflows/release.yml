name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer tag (for example v2.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'printmaster-org/scans' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  draft:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tested assets and editable draft notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          .\tools\New-ReleasePackage.ps1 -Version $env:RELEASE_VERSION -SourceCommit $env:GITHUB_SHA -OutputDirectory package
          .\tools\New-DraftRelease.ps1 -Version $env:RELEASE_VERSION -SourceCommit $env:GITHUB_SHA -PackageDirectory package

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned test dependency
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Parse scripts and run mocked tests
        shell: powershell
        run: |
          & ${{ matrix.shell }} -NoProfile -STA -File .\tests\Invoke-Tests.ps1 -OutputFile TestResults.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shell }}
          path: TestResults.xml
          if-no-files-found: warn
      - name: Test landing page rendering
        shell: powershell
        run: node --test .\tests\site.test.cjs

  required-checks:
    name: Required checks
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = "success"

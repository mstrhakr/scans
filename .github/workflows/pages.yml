name: Promote release and deploy Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published version to promote (also used for rollback/site refresh)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.repository == 'printmaster-org/scans' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published assets and build site
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          .\tools\Get-ReleaseCatalog.ps1 -OutputFile catalog.json
          .\tools\Build-Site.ps1 -CatalogPath catalog.json -StableVersion $env:RELEASE_VERSION -OutputDirectory _site
      - name: Upload generated Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
